name: Toolchain package regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      swift_ref:
        description: "Swift branch or commit to validate"
        default: "feature/gnu_objc_6.3"
      example_ref:
        description: "Example branch or commit to validate"
        default: "main"

permissions:
  contents: read

concurrency:
  group: toolchain-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the real example
        uses: actions/checkout@v4
        with:
          repository: OpenSwiftProject/toolchain-example
          ref: ${{ inputs.example_ref || 'main' }}
          path: .ci-example
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Test source revision handling
        run: bash tests/source-revision/run.sh
      - name: Resolve Swift source revision
        id: swift
        env:
          GH_TOKEN: ${{ github.token }}
          SWIFT_REF: ${{ inputs.swift_ref || 'feature/gnu_objc_6.3' }}
        run: |
          set -euo pipefail
          revision="$(gh api "repos/OpenSwiftProject/swift/commits/$SWIFT_REF" --jq '.sha')"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Swift revision: $revision"
          git -C .ci-example rev-parse HEAD
      - name: Build candidate image
        env:
          SWIFT_REVISION: ${{ steps.swift.outputs.revision }}
        run: |
          docker buildx build --platform linux/arm64 --load \
            --build-arg BUILD_JOBS=3 \
            --build-arg "SWIFT_REVISION=$SWIFT_REVISION" \
            --tag openswift/ci:test .
      - name: Verify fixture and real example
        run: bash ./scripts/smoke-test-release.sh openswift/ci:test .ci-example
